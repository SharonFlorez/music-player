<div class="flex flex-col gap-4">
  @for (playlist of playlists; track $index) {
  <div class="cursor-pointer hover:opacity-80" [pTooltip]="playlist.name" tooltipPosition="left"
    (click)="showPlaylist(playlist.id)">
    @if (playlist.songs.length) {
    <img class="w-12 h-12 rounded-lg" [ngSrc]="playlist.songs[0].image" alt="image"
      style="position: initial; width: 3rem; height: 3rem;" fill priority>
    } @else {
    <span class="material-icons-outlined text-gray text-5xl">
      image
    </span>
    }
  </div>
  }
</div>
