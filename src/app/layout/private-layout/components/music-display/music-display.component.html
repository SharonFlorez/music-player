<div class="flex flex-col bg-[#1F1F1F] h-auto rounded-md p-8"
  [ngClass]="isSongSelected ? 'pb-24' : (showPlaylist === undefined || showAllSongsList ? allSongs.length < 5 : showPlaylist.songs.length < 5) ? 'h-full' : ''">
  <app-header class="basis-1/3 grid"
    [albumImage]="showPlaylist === undefined || showAllSongsList ? albumImage : showPlaylist.songs.length ? showPlaylist.songs[0].image : null"
    [albumName]="showPlaylist === undefined || showAllSongsList ? 'All SONGS' : showPlaylist.name"></app-header>
  <hr class="text-gray opacity-15">
  <div class="basis-2/3 p-8">
    <ul class="flex items-center justify-between text-darkGray font-bold mb-16 px-4">
      <li class="text-lg basis-1/4"># Title</li>
      <li class="text-lg basis-1/4 text-center">Album</li>
      <li class="text-lg basis-1/4 text-end mr-2">Date</li>
      <li class="basis-1/4 text-end">
        <span class="material-icons-outlined">
          watch_later
        </span>
      </li>
    </ul>
    <app-song-card [allSongs]="showPlaylist === undefined || showAllSongsList ? allSongs : showPlaylist.songs"
      [allSongsView]="showPlaylist === undefined || showAllSongsList ? true : false" [album]="showPlaylist"
      (songSelected)="playSong($event)"></app-song-card>
  </div>
</div>
