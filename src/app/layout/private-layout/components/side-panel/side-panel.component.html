      home

    <span class="material-icons-outlined cursor-pointer text-darkGray text-3xl hover:text-white"
      pTooltip="Cerrar sesión" tooltipPosition="left" (click)="logout()">

  </section>

  <section class="flex flex-col items-center gap-4 bg-[#121212] rounded-md mr-2 mt-1 basis-4/5 p-2">
