<div class="bg-[#222222] h-screen">

  <div class="bg-[#121212] h-[10vh] flex items-center px-12">
    <h1 class="text-white font-bold text-3xl">Music Player</h1>
  </div>

  <div class="grid place-items-center h-[90vh]">
    <form [formGroup]="loginForm" class="flex flex-col gap-8 bg-[#121212] py-32 px-28 rounded-xl w-2/5">
      <p class="text-white text-3xl font-bold text-center">Inicia sesión</p>
      <div class="flex flex-col gap-8">
        <span class="p-float-label">
          <input pInputText class="flex w-full h-12" formControlName="email" id="floatingInput" type="text" />
          <label for=" email">Correo electrónico</label>
        </span>
        <section class="relative">
          <span class="p-float-label">
            <input pInputText class="flex w-full h-12" formControlName="password" id="floatingPassword"
              [type]="showPassword ? 'text' : 'password'" />
            <label for="password">Contraseña</label>
          </span>
          <span class="material-icons-outlined absolute top-3 right-2 cursor-pointer"
            (click)="togglePasswordVisibility()">
            {{!showPassword ? 'visibility' : 'visibility_off'}}
          </span>
        </section>
      </div>
      <div
        class="bg-[#1FDF64] rounded-3xl text-black text-center font-bold py-2 cursor-pointer hover:ring-2 hover:ring-[#1FDF64]"
        (click)="onSubmit()">
        <button type="submit" [disabled]="isLoading || loginForm.invalid"
          [class.submit-btn-disabled]="loginForm.invalid">
          <span class="cursor-pointer" *ngIf="!isLoading">
            Ingresar
          </span>
          <span *ngIf="isLoading">
            <span aria-hidden="true" class="spinner-border spinner-border-sm" role="status"></span>
            <span class="visually-hidden">Loading...</span>
          </span>
        </button>
      </div>

      <p *ngIf="errorLogin" class="text-red">{{ error || 'Usuario o contraseña inválidos'}}</p>
    </form>
  </div>
</div>
